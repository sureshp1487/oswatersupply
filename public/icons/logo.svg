<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
    <defs>
        <linearGradient id="hydroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#3b82f6" />
            <stop offset="50%" stop-color="#4f46e5" />
            <stop offset="100%" stop-color="#4338ca" />
        </linearGradient>
        <linearGradient id="dropGrad" x1="20%" y1="0%" x2="80%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="60%" stop-color="#e0e7ff" />
            <stop offset="100%" stop-color="#c7d2fe" />
        </linearGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4f46e5" flood-opacity="0.45" />
        </filter>
    </defs>

    <!-- Outer Rounded Modern Container -->
    <rect width="512" height="512" rx="128" fill="url(#hydroGrad)" />

    <!-- Sleek Pro Ring -->
    <circle cx="256" cy="256" r="210" stroke="white" stroke-width="8" stroke-dasharray="16 12" stroke-opacity="0.3" />

    <!-- Pure Water Droplet with Modern Peak -->
    <g filter="url(#glow)">
        <path d="M256 90 
                 C256 90 380 230 380 320 
                 A124 124 0 1 1 132 320 
                 C132 230 256 90 256 90 Z" 
              fill="url(#dropGrad)" />

        <!-- Droplet Sheen Highlight -->
        <path d="M220 180 
                 C240 220 220 270 190 290 
                 C180 270 185 230 205 195 
                 C210 188 215 183 220 180 Z" 
              fill="white" 
              fill-opacity="0.8" />

        <!-- Electric Accent Waves inside Droplet -->
        <path d="M180 350 Q 220 330 256 350 T 332 350" 
              stroke="#4f46e5" 
              stroke-width="12" 
              stroke-linecap="round" 
              fill="none" 
              opacity="0.9" />
        
        <path d="M205 385 Q 235 372 256 385 T 307 385" 
              stroke="#6366f1" 
              stroke-width="10" 
              stroke-linecap="round" 
              fill="none" 
              opacity="0.8" />
    </g>

    <!-- Small Sparkle / Pro Star -->
    <polygon points="340,140 346,158 364,164 346,170 340,188 334,170 316,164 334,158" fill="#ffffff" opacity="0.95" />
</svg>
